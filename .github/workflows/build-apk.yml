name: Build and Release APK

on:
  push:
    branches: [ "newpipe" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure gradlew is executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleContinuous --stacktrace -DskipFormatKtlint -x test -x lint

    - name: Prepare Release Asset
      id: prepare_release
      run: |
        mkdir -p release-output
        echo "Searching for APKs..."
        find app/build/outputs/apk/ -type f -name "*.apk"
        APK_PATH=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "ERROR: No APK found in app/build/outputs/apk!"
          exit 1
        fi
        echo "Found APK: $APK_PATH"

        # Dynamically extract version from app/build.gradle.kts
        VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
        SHORT_VERSION=$(echo "$VERSION" | sed -E 's/\.0$//')
        TAG="v${SHORT_VERSION}"

        echo "Detected Version: $VERSION (Tag: $TAG)"
        echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
        echo "RELEASE_NAME=AdFreeYT $TAG" >> $GITHUB_ENV

        # Copy APK with exact version tag and generic latest name
        cp "$APK_PATH" "release-output/AdFreeYT_${TAG}.apk"
        cp "$APK_PATH" "release-output/AdFreeYT_latest.apk"
        ls -lh release-output/

    - name: Dynamically Update README in CI
      run: |
        TAG="${{ env.RELEASE_TAG }}"
        echo "Updating README for release $TAG..."

        # Update download link references and version strings in both README.md and doc/README.md
        for file in README.md doc/README.md; do
          if [ -f "$file" ]; then
            sed -i -E "s/AdFreeYT_(latest|v[0-9]+(\.[0-9]+)*)\.apk/AdFreeYT_${TAG}.apk/g" "$file"
            sed -i -E "s/Download (Latest )?AdFreeYT( v[0-9]+(\.[0-9]+)*)? APK/Download AdFreeYT ${TAG} APK/g" "$file"
            sed -i -E "s/What's New in v[0-9]+(\.[0-9]+)*/What's New in ${TAG}/g" "$file"
          fi
        done

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md doc/README.md
        if ! git diff --staged --quiet; then
          git commit -m "docs: dynamically update README for release ${TAG} [skip ci]"
          git push origin HEAD:newpipe
        else
          echo "README is already up to date."
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdFreeYT-apk
        path: release-output/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/newpipe' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ env.RELEASE_NAME }}
        tag_name: ${{ env.RELEASE_TAG }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: release-output/*.apk

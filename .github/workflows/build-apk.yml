name: Build and Release APK

on:
  push:
    branches: [ "newpipe" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure gradlew is executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleContinuous --stacktrace -DskipFormatKtlint -x test -x lint

    - name: Prepare Release Asset
      run: |
        mkdir -p release-output
        echo "Searching for APKs..."
        find app/build/outputs/apk/ -type f -name "*.apk"
        APK_PATH=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "ERROR: No APK found in app/build/outputs/apk!"
          exit 1
        fi
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" release-output/AdFreeYT_v4.9.apk
        cp "$APK_PATH" release-output/AdFreeYT_v4.8.apk
        cp "$APK_PATH" release-output/AdFreeYT_v4.7.apk
        cp "$APK_PATH" release-output/AdFreeYT_v4.6.apk
        cp "$APK_PATH" release-output/AdFreeYT_v4.5.apk
        cp "$APK_PATH" release-output/AdFreeYT_v4.4.apk
        cp "$APK_PATH" release-output/AdFreeYT_v4.3.apk
        cp "$APK_PATH" release-output/AdFreeYT_v4.2.apk
        cp "$APK_PATH" release-output/AdFreeYT_v4.1.apk
        cp "$APK_PATH" release-output/AdFreeYT_v4.0.apk
        cp "$APK_PATH" release-output/AdFreeYT_v3.9.apk
        cp "$APK_PATH" release-output/AdFreeYT_v3.8.apk
        cp "$APK_PATH" release-output/AdFreeYT_v3.7.apk
        cp "$APK_PATH" release-output/AdFreeYT_v3.6.apk
        cp "$APK_PATH" release-output/AdFreeYT_v3.5.apk
        cp "$APK_PATH" release-output/AdFreeYT_v3.4.apk
        cp "$APK_PATH" release-output/AdFreeYT_v3.3.apk
        cp "$APK_PATH" release-output/AdFreeYT_v3.2.apk
        cp "$APK_PATH" release-output/AdFreeYT_v3.1.apk
        cp "$APK_PATH" release-output/AdFreeYT_v3.0.apk
        ls -lh release-output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdFreeYT-apk
        path: release-output/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/newpipe' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        name: "AdFreeYT v4.9"
        tag_name: "v4.9"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          release-output/AdFreeYT_v4.9.apk
          release-output/AdFreeYT_v4.8.apk
          release-output/AdFreeYT_v4.7.apk
          release-output/AdFreeYT_v4.6.apk
          release-output/AdFreeYT_v4.5.apk
          release-output/AdFreeYT_v4.4.apk
          release-output/AdFreeYT_v4.3.apk
          release-output/AdFreeYT_v4.2.apk
          release-output/AdFreeYT_v4.1.apk
          release-output/AdFreeYT_v4.0.apk
          release-output/AdFreeYT_v3.9.apk
          release-output/AdFreeYT_v3.8.apk
          release-output/AdFreeYT_v3.7.apk
          release-output/AdFreeYT_v3.6.apk
          release-output/AdFreeYT_v3.5.apk
          release-output/AdFreeYT_v3.4.apk
          release-output/AdFreeYT_v3.3.apk
          release-output/AdFreeYT_v3.2.apk
          release-output/AdFreeYT_v3.1.apk
          release-output/AdFreeYT_v3.0.apk

name: Build and Release APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle wrapper if missing
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.6
        fi
        chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare Release Asset
      run: |
        TAG="${{ github.ref_name }}"
        if [[ "$TAG" == "main" || -z "$TAG" ]]; then
          TAG="v2.1"
        fi
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk "release-output/AdsFreeYT_${TAG}.apk"
        echo "RELEASE_FILE=release-output/AdsFreeYT_${TAG}.apk" >> $GITHUB_ENV
        echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
        ls -la release-output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdsFreeYT-apk
        path: release-output/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        name: "AdsFreeYT ${{ github.ref_name }}"
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: release-output/*.apk

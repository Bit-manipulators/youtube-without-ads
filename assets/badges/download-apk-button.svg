<svg xmlns="http://www.w3.org/2000/svg" width="420" height="96" viewBox="0 0 420 96">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="45%" stop-color="#E60000"/>
      <stop offset="100%" stop-color="#B80000"/>
    </linearGradient>
    <!-- Top Sheen Gradient -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E60000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Button Base -->
  <g filter="url(#shadow)">
    <rect x="6" y="6" width="408" height="80" rx="20" fill="url(#btnBg)" stroke="#FFA3A3" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Top Glass Sheen -->
  <rect x="7.5" y="7.5" width="405" height="38" rx="18.5" fill="url(#sheen)"/>

  <!-- Left Icon Circle -->
  <circle cx="52" cy="46" r="24" fill="#FFFFFF" fill-opacity="0.18"/>
  <circle cx="52" cy="46" r="23" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" fill="none"/>

  <!-- Download Arrow Icon -->
  <g transform="translate(52, 46)">
    <!-- Arrow Stem and Point -->
    <path d="M 0 -10 L 0 7" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M -6.5 1.5 L 0 8 L 6.5 1.5" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Tray -->
    <path d="M -9 11 L 9 11" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Button Texts -->
  <!-- Sub-header -->
  <text x="96" y="32" fill="#FFE5E5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.8">DIRECT DOWNLOAD</text>

  <!-- Main Title -->
  <text x="96" y="56" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">Download AdFreeYT v4.7</text>

  <!-- Badge Details / Chip -->
  <text x="96" y="73" fill="#FFCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">16 MB • Zero Ads • No Root Required</text>
</svg>
